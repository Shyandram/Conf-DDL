name: Deploy calendar worker

# Deploys worker/ (the merged "My conferences" calendar) to Cloudflare Workers.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see worker/README.md);
# without them the job just says so and stops.
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy (see worker/README.md)."
            exit 0
          fi
          # the KV namespace that keeps each browser's starred series: made on the first deploy, then reused
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          title="conf-ddl-calendar-stars"
          kv_id=$(curl -fsS -H "$auth" "$api?per_page=100" | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title'] == '$title'), ''))")
          if [ -z "$kv_id" ]; then
            kv_id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "{\"title\": \"$title\"}" "$api" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['id'])")
            echo "Created KV namespace $title"
          fi
          printf '\n[[kv_namespaces]]\nbinding = "STARS"\nid = "%s"\n' "$kv_id" >> worker/wrangler.toml
          cd worker && npx --yes wrangler@4 deploy
