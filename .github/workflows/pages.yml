name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate conference data
        run: python3 scripts/validate.py
      - name: Build the calendar feeds (calendar/*.ics)
        run: python3 scripts/build_calendar.py --site "https://conf-ddl.shyandram.dev/"
      - name: Minify scripts, styles and data (the repo keeps the readable sources)
        run: |
          npx --yes esbuild@0.24.0 assets/app.js assets/style.css sw.js --minify --target=es2020 --outdir=. --outbase=. --allow-overwrite
          python3 - <<'PY'
          import json
          for f in ("data/conferences.json", "data/cities.json"):
              data = json.load(open(f, encoding="utf-8"))
              with open(f, "w", encoding="utf-8") as out:
                  json.dump(data, out, ensure_ascii=False, separators=(",", ":"))
          PY
      - name: Version asset URLs so browsers fetch the new build
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
